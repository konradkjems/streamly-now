version: '3.8'

services:
  # Vue Movies Frontend
  vue-movies:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-movies-app
    restart: unless-stopped
    volumes:
      - ./dist:/var/www/html
    networks:
      - vue-movies-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vue-movies-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/var/www/vue-movies/dist
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - vue-movies
    networks:
      - vue-movies-network

  # Optional: Redis for caching
  redis:
    image: redis:alpine
    container_name: vue-movies-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - vue-movies-network

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: vue-movies-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - vue-movies-network

volumes:
  redis_data:

networks:
  vue-movies-network:
    driver: bridge
